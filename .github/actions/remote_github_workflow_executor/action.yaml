name: Remote GitHub Workflow Executor
description: Trigger a remote workflow, wait for completion, and expose the result to the caller workflow

inputs:
  github_token:
    description: GitHub token with permission to trigger workflows in the target repository
    required: true
  target_repo_owner:
    description: Target repository owner (e.g. "canonical")
    required: true
  target_repo_name:
    description: Target repository name
    required: true
  target_workflow:
    description: Target workflow id or workflow file name within the target repo's .github/workflows/ directory (e.g. "workflow.yaml")
    required: true
  target_ref:
    description: Target git ref to dispatch
    required: false
    default: main
  workflow_inputs_json:
    description: JSON object string for workflow inputs
    required: false
    default: '{}'
  metadata:
    description: Arbitrary JSON metadata to pass to the remote workflow's metadata input (merged with auto-collected caller context)
    required: false
    default: '{}'
  collect_outputs:
    description: Whether to collect structured outputs returned by the remote workflow
    required: false
    default: 'true'
  outputs_artifact:
    description: Name of the artifact the remote workflow uploads its outputs JSON in
    required: false
    default: workflow-outputs
  outputs_step_prefix:
    description: Step-name prefix the remote workflow uses to return outputs JSON inline when it uploads no artifact
    required: false
    default: 'outputs::'

outputs:
  run_id:
    description: Triggered remote workflow run id
    value: ${{ steps.return_status.outputs.run_id }}
  run_url:
    description: Triggered remote workflow run URL
    value: ${{ steps.return_status.outputs.run_url }}
  conclusion:
    description: Triggered remote workflow conclusion
    value: ${{ steps.return_status.outputs.conclusion }}
  remote_outputs:
    description: JSON object of data returned by the remote workflow; '{}' when it returned none
    value: ${{ steps.return_status.outputs.remote_outputs }}
  remote_outputs_source:
    description: Where the outputs came from - artifact, step, or none
    value: ${{ steps.return_status.outputs.remote_outputs_source }}

runs:
  using: composite
  steps:
    - name: Workflow invocation details
      id: invocation_details
      shell: bash
      env:
        TARGET_REPO_OWNER: ${{ inputs.target_repo_owner }}
        TARGET_REPO_NAME: ${{ inputs.target_repo_name }}
        TARGET_WORKFLOW: ${{ inputs.target_workflow }}
        TARGET_REF: ${{ inputs.target_ref }}
        WORKFLOW_INPUTS_JSON: ${{ inputs.workflow_inputs_json }}
      run: |
        cat << EOF
        ------------------------------------------------------------------------
        WORKFLOW INVOCATION DETAILS
        ------------------------------------------------------------------------

        CALLER INFORMATION:
          Caller Repository: ${{ github.repository }}
          Caller Actor: ${{ github.actor }}
          Caller Trigger Event: ${{ github.event_name }}
          Caller Workflow File: ${{ github.workflow }}
          Caller Run ID: ${{ github.run_id }}
          Caller Run Number: ${{ github.run_number }}
          Caller Ref: ${{ github.ref }}
          Caller SHA: ${{ github.sha }}

        INVOCATION TIMESTAMP:
          $(date -u '+%Y-%m-%d %H:%M:%S UTC')

        TARGET REPOSITORY:
          ${TARGET_REPO_OWNER}/${TARGET_REPO_NAME}
          Workflow: ${TARGET_WORKFLOW}
          Ref: ${TARGET_REF}

        TARGET INPUTS JSON:
          ${WORKFLOW_INPUTS_JSON}

        ------------------------------------------------------------------------
        EOF

    - name: Build metadata and merge into workflow inputs
      id: build_inputs
      shell: bash
      env:
        WORKFLOW_INPUTS_JSON: ${{ inputs.workflow_inputs_json }}
        CALLER_METADATA: ${{ inputs.metadata }}
        CALLER_REPO: ${{ github.repository }}
        CALLER_RUN_ID: ${{ github.run_id }}
        CALLER_RUN_ATTEMPT: ${{ github.run_attempt }}
        CALLER_ACTOR: ${{ github.actor }}
        CALLER_SHA: ${{ github.sha }}
        CALLER_REF: ${{ github.ref }}
        CALLER_WORKFLOW: ${{ github.workflow }}
        CALLER_EVENT: ${{ github.event_name }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
      run: ${{ github.action_path }}/scripts/build-metadata.sh

    - name: Trigger and record run ID
      id: trigger_and_record
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        TARGET_REPO_OWNER: ${{ inputs.target_repo_owner }}
        TARGET_REPO_NAME: ${{ inputs.target_repo_name }}
        TARGET_WORKFLOW: ${{ inputs.target_workflow }}
        TARGET_REF: ${{ inputs.target_ref }}
        WORKFLOW_INPUTS_JSON: ${{ steps.build_inputs.outputs.workflow_inputs_json }}
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}/go/trigger_and_record"
        go run . \
          -owner "${TARGET_REPO_OWNER}" \
          -repo "${TARGET_REPO_NAME}" \
          -workflow "${TARGET_WORKFLOW}" \
          -ref "${TARGET_REF}" \
          -inputs "${WORKFLOW_INPUTS_JSON}"

    - name: Monitor run
      id: monitor_run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        TARGET_REPO_OWNER: ${{ inputs.target_repo_owner }}
        TARGET_REPO_NAME: ${{ inputs.target_repo_name }}
        RUN_ID: ${{ steps.trigger_and_record.outputs.run_id }}
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}/go/monitor_run"
        go run . \
          -owner "${TARGET_REPO_OWNER}" \
          -repo "${TARGET_REPO_NAME}" \
          -run-id "${RUN_ID}"

    # Runs even when the remote failed: partial outputs (a dashboard link, an
    # execution id) are exactly what a caller needs to triage the failure.
    - name: Collect remote outputs
      id: collect_outputs
      if: always() && inputs.collect_outputs == 'true' && steps.trigger_and_record.outputs.run_id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        TARGET_REPO_OWNER: ${{ inputs.target_repo_owner }}
        TARGET_REPO_NAME: ${{ inputs.target_repo_name }}
        RUN_ID: ${{ steps.trigger_and_record.outputs.run_id }}
        OUTPUTS_ARTIFACT: ${{ inputs.outputs_artifact }}
        OUTPUTS_STEP_PREFIX: ${{ inputs.outputs_step_prefix }}
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}/go/collect_outputs"
        go run . \
          -owner "${TARGET_REPO_OWNER}" \
          -repo "${TARGET_REPO_NAME}" \
          -run-id "${RUN_ID}" \
          -artifact "${OUTPUTS_ARTIFACT}" \
          -step-prefix "${OUTPUTS_STEP_PREFIX}"

    - name: Completion summary
      id: completion_summary
      if: always()
      shell: bash
      env:
        TARGET_REPO_OWNER: ${{ inputs.target_repo_owner }}
        TARGET_REPO_NAME: ${{ inputs.target_repo_name }}
        TARGET_WORKFLOW: ${{ inputs.target_workflow }}
        RUN_ID: ${{ steps.trigger_and_record.outputs.run_id }}
        RUN_URL: ${{ steps.monitor_run.outputs.run_url }}
        CONCLUSION: ${{ steps.monitor_run.outputs.conclusion }}
        REMOTE_OUTPUTS: ${{ steps.collect_outputs.outputs.remote_outputs }}
        REMOTE_OUTPUTS_SOURCE: ${{ steps.collect_outputs.outputs.remote_outputs_source }}
      run: |
        cat << EOF
        ------------------------------------------------------------------------
        WORKFLOW COMPLETION SUMMARY
        ------------------------------------------------------------------------

        CALLER:
          Repository: ${{ github.repository }}
          Actor: ${{ github.actor }}
          Run: ${{ github.run_id }}

        REMOTE EXECUTION:
          Target Repository: ${TARGET_REPO_OWNER}/${TARGET_REPO_NAME}
          Workflow: ${TARGET_WORKFLOW}
          Remote Run: ${RUN_ID}
          Remote URL: ${RUN_URL}
          Conclusion: ${CONCLUSION}

        REMOTE OUTPUTS:
          Source: ${REMOTE_OUTPUTS_SOURCE:-not collected}
          Data: ${REMOTE_OUTPUTS}

        COMPLETION TIMESTAMP:
          $(date -u '+%Y-%m-%d %H:%M:%S UTC')

        ------------------------------------------------------------------------
        EOF

    - name: Return status to caller
      id: return_status
      if: always()
      shell: bash
      env:
        RUN_ID: ${{ steps.trigger_and_record.outputs.run_id }}
        RUN_URL: ${{ steps.monitor_run.outputs.run_url }}
        CONCLUSION: ${{ steps.monitor_run.outputs.conclusion }}
        MONITOR_OUTCOME: ${{ steps.monitor_run.outcome }}
        REMOTE_OUTPUTS: ${{ steps.collect_outputs.outputs.remote_outputs }}
        REMOTE_OUTPUTS_SOURCE: ${{ steps.collect_outputs.outputs.remote_outputs_source }}
      run: |
        set -euo pipefail

        echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
        echo "run_url=${RUN_URL}" >> "${GITHUB_OUTPUT}"
        echo "conclusion=${CONCLUSION}" >> "${GITHUB_OUTPUT}"
        echo "remote_outputs_source=${REMOTE_OUTPUTS_SOURCE:-none}" >> "${GITHUB_OUTPUT}"

        # Heredoc form with a per-run delimiter: the payload is caller-supplied
        # JSON, so it must never be able to terminate its own output block.
        DELIMITER="REMOTE_OUTPUTS_$(date +%s)_${RANDOM}${RANDOM}"
        {
          echo "remote_outputs<<${DELIMITER}"
          echo "${REMOTE_OUTPUTS:-{\}}"
          echo "${DELIMITER}"
        } >> "${GITHUB_OUTPUT}"

        if [ "${MONITOR_OUTCOME}" = "failure" ]; then
          echo "ERROR: Monitor step failed"
          exit 1
        fi

        if [ "${CONCLUSION}" != "success" ]; then
          echo "ERROR: Remote workflow finished with conclusion: ${CONCLUSION}"
          exit 1
        fi

        echo "OK: Remote workflow completed"
