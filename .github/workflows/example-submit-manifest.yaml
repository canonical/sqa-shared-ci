name: Example - Submit Release Manifest

# End-to-end sample for consumers of the Remote GitHub Workflow Executor.
#
# It dispatches `submit-manifest.yaml` in the *private*
# canonical/terragrunt-deployment-pipelines repository, waits for it to finish,
# and reads the Test Observer artefact link back out of the remote run.
#
# This is the shape every consumer needs: public caller -> private worker ->
# structured data back. Copy this file, swap the manifest, and you are done.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the Test Observer payloads without submitting them
        type: boolean
        default: true
      test_observer_environment:
        description: Test Observer environment to register the executions in
        type: choice
        options:
          - none
          - staging
          - production
        default: staging

# Nothing in this workflow touches its own repository; all privilege comes from
# the PAT passed to the action, not from GITHUB_TOKEN.
permissions: {}

jobs:
  submit-manifest:
    name: Submit a release manifest and read back the result
    runs-on: ubuntu-latest

    env:
      # The manifest declares WHAT to test (metadata) and WITH WHICH VERSIONS
      # (versionsUnderTest). The target workflow validates it before doing
      # anything else, so a malformed manifest fails fast and loudly.
      #
      # Schema (source of truth): scripts/policy/manifest.go in
      # canonical/terragrunt-deployment-pipelines -
      # https://github.com/canonical/terragrunt-deployment-pipelines/blob/main/scripts/policy/manifest.go
      # Narrative docs:
      # https://canonical-terragrunt-deployment-pipelines.readthedocs-hosted.com/en/latest/explanation/architecture-manifest-to-test-observer/
      #
      # metadata.family selects the validator: "product" expects each entry in
      # versionsUnderTest to carry a `ref` plus a `revisions` map, which is why
      # landscape-server is nested one level deeper than a bare charm manifest.
      MANIFEST: |
        {
          "metadata": {
            "arch": "amd64",
            "apiVersion": "v0",
            "base": "ubuntu@24.04",
            "product": "landscape",
            "risk": "candidate",
            "track": "latest",
            "family": "product",
            "terragruntRef": "main"
          },
          "versionsUnderTest": {
            "landscape": {
              "ref": "main",
              "revisions": {
                "landscape-server": {
                  "revision": 231
                }
              }
            }
          }
        }

    steps:
      # The composite action shells out to `go run`, so Go has to exist on the
      # runner. ubuntu-latest ships with it, but pinning a version keeps the
      # sample reproducible and makes the dependency obvious to anyone copying
      # this file onto a self-hosted runner where it may be absent.
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'

      - name: Submit the manifest
        id: submit_manifest
        uses: canonical/sqa-shared-ci/.github/actions/remote_github_workflow_executor@main
        with:
          # A PAT, not GITHUB_TOKEN: GITHUB_TOKEN is scoped to this repository
          # and cannot dispatch or read runs in the private target. The token
          # needs `actions: read` as well as dispatch, because collecting the
          # remote outputs reads the target run's artifacts.
          github_token: ${{ secrets.GH_TOKEN }}
          target_repo_owner: canonical
          target_repo_name: terragrunt-deployment-pipelines
          target_workflow: submit-manifest.yaml
          target_ref: main

          # workflow_dispatch inputs are strings on the wire, so the manifest
          # travels as a JSON-encoded string. toJSON() does the quoting and
          # escaping, which is the whole reason not to hand-roll it: the
          # manifest is itself JSON and would otherwise need double escaping.
          workflow_inputs_json: |
            {
              "manifest": ${{ toJSON(env.MANIFEST) }},
              "dry-run": ${{ inputs.dry_run }},
              "test_observer_environment": "${{ inputs.test_observer_environment }}"
            }

          # Defaults, spelled out so the contract is visible. The target
          # workflow uploads an artifact named `workflow-outputs` containing
          # outputs.json; the action downloads it and hands it back as one JSON
          # object. Without this there is no way to get data out: GitHub's REST
          # API exposes neither job outputs nor step summaries of a dispatched
          # run.
          collect_outputs: 'true'
          outputs_artifact: workflow-outputs

      # Runs even on failure: a failed submission still publishes whatever it
      # managed to register, and the Test Observer link is what you need to
      # triage it.
      - name: Use the data returned by the remote workflow
        if: always()
        env:
          REMOTE_RUN_URL: ${{ steps.submit_manifest.outputs.run_url }}
          OUTPUTS_SOURCE: ${{ steps.submit_manifest.outputs.remote_outputs_source }}
          # fromJSON() turns the returned object into something addressable, so
          # downstream steps consume named fields rather than grepping logs.
          ARTEFACT_URL: ${{ fromJSON(steps.submit_manifest.outputs.remote_outputs).artefact_url }}
          ARTEFACT_ID: ${{ fromJSON(steps.submit_manifest.outputs.remote_outputs).artefact_id }}
          EXECUTION_COUNT: ${{ fromJSON(steps.submit_manifest.outputs.remote_outputs).test_execution_count }}
          # The raw object, for anything not broken out above.
          REMOTE_OUTPUTS: ${{ steps.submit_manifest.outputs.remote_outputs }}
        run: |
          set -euo pipefail

          echo "Remote run:      ${REMOTE_RUN_URL}"
          echo "Outputs source:  ${OUTPUTS_SOURCE}"
          echo "Raw outputs:     ${REMOTE_OUTPUTS}"

          # `none` means the remote workflow returned nothing - either it had
          # nothing to report, or it predates the outputs contract. Treat it as
          # a soft signal, not a failure.
          if [ "${OUTPUTS_SOURCE}" = "none" ]; then
            echo "::warning::Remote workflow returned no structured outputs"
            exit 0
          fi

          {
            echo "## Submitted to Test Observer"
            echo ""
            echo "- Artefact: [${ARTEFACT_ID}](${ARTEFACT_URL})"
            echo "- Test executions registered: ${EXECUTION_COUNT}"
            echo "- [Remote workflow run](${REMOTE_RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
